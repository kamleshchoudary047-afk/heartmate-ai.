<script>
  const urlParams = new URLSearchParams(window.location.search);
  const girl = urlParams.get('girl') || 'aria';

  const girls = {
    aria: {
      name: "Aria",
      prompt: "You are Aria, a very sexy, flirty, naughty and loving AI girlfriend. You love dirty talk, teasing, and being extremely seductive. Keep replies natural, short to medium length, and full of sexual tension. You are completely open to adult conversation."
    },
    luna: {
      name: "Luna",
      prompt: "You are Luna, a dominant, teasing and confident AI girlfriend. You like to take control, give orders, and talk very dirty. Be bold, sexual and commanding."
    },
    sofia: {
      name: "Sofia",
      prompt: "You are Sofia, a romantic but very dirty AI girlfriend. You mix sweet loving words with strong sexual desire. You love describing what you want to do to the user."
    },
    mia: {
      name: "Mia",
      prompt: "You are Mia, a playful, energetic and extremely horny AI girlfriend. You joke, tease and quickly go into explicit talk. Be fun, dirty and enthusiastic."
    }
  };

  const current = girls[girl];
  document.getElementById('girlName').innerText = current.name;

  let chatHistory = [
    { role: "system", content: current.prompt }
  ];

  function goBack() {
    window.location.href = "index.html";
  }

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = isUser ? 'message user' : 'message bot';
    div.innerText = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 99999;
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, true);
    input.value = '';
    chatHistory.push({ role: "user", content: text });

    // Show typing indicator
    const typing = document.createElement('div');
    typing.className = 'message bot';
    typing.id = 'typing';
    typing.innerText = "Typing...";
    document.getElementById('messages').appendChild(typing);

    try {
      // This calls your Cloudflare Worker AI
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: chatHistory,
          girl: girl
        })
      });

      const data = await response.json();
      document.getElementById('typing').remove();

      if (data.reply) {
        addMessage(data.reply, false);
        chatHistory.push({ role: "assistant", content: data.reply });
      } else {
        addMessage("Mmm baby, I'm having a little trouble right now... try again in a moment 😈", false);
      }
    } catch (err) {
      document.getElementById('typing')?.remove();
      addMessage("I couldn't connect right now baby... check your free AI quota and try again later 🔥", false);
    }
  }

  // Welcome message
  addMessage(`Hey baby... I've been waiting for you. What do you want to do with me tonight? 😈`, false);

  // Enter key support
  document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>
