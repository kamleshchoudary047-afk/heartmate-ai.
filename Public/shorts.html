<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b1b">
<title>Heartmate AI — Shorts</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#100b1b;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:10;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#100b1b,transparent);
}
.brand{color:#ff83bd;font-weight:bold;font-size:20px}
header a{color:white;text-decoration:none}
.feed{
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.video-card{
  height:100dvh;
  width:100%;
  position:relative;
  scroll-snap-align:start;
  background:#1d152b;
  display:flex;
  align-items:center;
  justify-content:center;
}
.video-card video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.overlay{
  position:absolute;
  bottom:35px;
  left:18px;
  right:75px;
  z-index:2;
  text-shadow:0 2px 8px #000;
}
.overlay h2{margin:0 0 8px;font-size:22px}
.overlay p{margin:0;font-size:14px}
.controls{
  position:absolute;
  right:16px;
  bottom:45px;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.controls button{
  border:0;
  border-radius:50%;
  width:48px;height:48px;
  color:white;
  background:#ffffff30;
  font-size:21px;
}
.message{
  position:absolute;
  top:50%;
  left:15px;
  right:15px;
  text-align:center;
  color:#ffb5d5;
}
</style>

<style id="heartmate-shorts-premium">
:root{color-scheme:dark}
body{background:#0d070b;color:#fff5ef;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 22px;background:linear-gradient(180deg,rgba(13,7,11,.96),rgba(13,7,11,.55),transparent)}
.brand{color:#f0c6a8;letter-spacing:-.5px;text-shadow:0 4px 24px #000}
header a{padding:9px 15px;border:1px solid #e8c49a55;border-radius:24px;background:#1b1017cc;color:#ffe1c8;font-size:12px}
.video-card{background:radial-gradient(circle at 50% 30%,#532b3c,#0d070b 72%)}
.video-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#0d070bd9,transparent 45%,#0d070b25)}
.video-card video{filter:saturate(.9)}
.overlay{z-index:3;bottom:42px;left:22px;right:82px}
.overlay h2{font-family:Georgia,serif;font-size:26px;color:#ffe1c8}
.overlay p{color:#f1d8d5;line-height:1.6}
.controls{z-index:4;right:17px;bottom:46px}
.controls button{border:1px solid #f1d4b255;background:#25151dcc;box-shadow:0 8px 24px #0005;backdrop-filter:blur(12px)}
.message{z-index:2;color:#f0c6a8;font-family:Georgia,serif;font-size:18px;line-height:1.7}
</style>
</head>

<body>

<header>
  <div class="brand">♥ Heartmate Shorts</div>
  <a href="/chat.html">Back to Chat</a>
</header>

<main class="feed" id="feed">
  <div class="message" id="message">
    Your Shorts videos will appear here.
    <br><br>
    Add your MP4 videos to the Public/shorts/ folder.
  </div>
</main>

<script>
const videos = [
  {
    file: "/shorts/day-01.mp4",
    name: "Your Companion",
    caption: "A little moment just for you ♥"
  },
  {
    file: "/shorts/day-02.mp4",
    name: "Your Companion",
    caption: "Welcome back ♥"
  },
  {
    file: "/shorts/day-03.mp4",
    name: "Your Companion",
    caption: "Let's spend some time together."
  }
];

const feed = document.getElementById("feed");
const message = document.getElementById("message");

function showVideos(){
  const today = Math.floor(Date.now() / 86400000);
  const ordered = videos.map((_,i) =>
    videos[(i + today) % videos.length]
  );

  message.remove();

  ordered.forEach(item => {
    const card = document.createElement("section");
    card.className = "video-card";

    const video = document.createElement("video");
    video.src = item.file;
    video.autoplay = true;
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.preload = "metadata";

    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      "<h2></h2><p></p>";
    overlay.querySelector("h2").textContent = item.name;
    overlay.querySelector("p").textContent = item.caption;

    const controls = document.createElement("div");
    controls.className = "controls";

    const mute = document.createElement("button");
    mute.textContent = "🔇";
    mute.setAttribute("aria-label","Toggle sound");
    mute.onclick = () => {
      video.muted = !video.muted;
      mute.textContent = video.muted ? "🔇" : "🔊";
    };

    const play = document.createElement("button");
    play.textContent = "Ⅱ";
    play.setAttribute("aria-label","Play or pause");
    play.onclick = () => {
      if(video.paused){
        video.play();
        play.textContent = "Ⅱ";
      }else{
        video.pause();
        play.textContent = "▶";
      }
    };

    controls.append(mute,play);
    card.append(video,overlay,controls);
    feed.append(card);
  });

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const video = entry.target.querySelector("video");
      if(entry.isIntersecting){
        document.querySelectorAll(".video-card video").forEach(v => {
          if(v !== video) v.pause();
        });
        video.play().catch(() => {});
      }else{
        video.pause();
      }
    });
  },{root:feed,threshold:0.65});

  document.querySelectorAll(".video-card").forEach(card =>
    observer.observe(card)
  );
}

showVideos();
</script>

</body>
</html>
