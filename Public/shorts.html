<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b1b">
<title>Heartmate AI — Shorts</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#100b1b;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  position:fixed;
  top:0;left:0;right:0;
  z-index:10;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#100b1b,transparent);
}
.brand{color:#ff83bd;font-weight:bold;font-size:20px}
header a{color:white;text-decoration:none}
.feed{
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.video-card{
  height:100dvh;
  width:100%;
  position:relative;
  scroll-snap-align:start;
  background:#1d152b;
  display:flex;
  align-items:center;
  justify-content:center;
}
.video-card video{
  width:100%;
  height:100%;
  object-fit:cover;
}
.overlay{
  position:absolute;
  bottom:35px;
  left:18px;
  right:75px;
  z-index:2;
  text-shadow:0 2px 8px #000;
}
.overlay h2{margin:0 0 8px;font-size:22px}
.overlay p{margin:0;font-size:14px}
.controls{
  position:absolute;
  right:16px;
  bottom:45px;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.controls button{
  border:0;
  border-radius:50%;
  width:48px;height:48px;
  color:white;
  background:#ffffff30;
  font-size:21px;
}
.message{
  position:absolute;
  top:50%;
  left:15px;
  right:15px;
  text-align:center;
  color:#ffb5d5;
}
</style>

<style id="heartmate-shorts-premium">
:root{color-scheme:dark}
body{background:#0d070b;color:#fff5ef;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:18px 22px;background:linear-gradient(180deg,rgba(13,7,11,.96),rgba(13,7,11,.55),transparent)}
.brand{color:#f0c6a8;letter-spacing:-.5px;text-shadow:0 4px 24px #000}
header a{padding:9px 15px;border:1px solid #e8c49a55;border-radius:24px;background:#1b1017cc;color:#ffe1c8;font-size:12px}
.video-card{background:radial-gradient(circle at 50% 30%,#532b3c,#0d070b 72%)}
.video-card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#0d070bd9,transparent 45%,#0d070b25)}
.video-card video{filter:saturate(.9)}
.overlay{z-index:3;bottom:42px;left:22px;right:82px}
.overlay h2{font-family:Georgia,serif;font-size:26px;color:#ffe1c8}
.overlay p{color:#f1d8d5;line-height:1.6}
.controls{z-index:4;right:17px;bottom:46px}
.controls button{border:1px solid #f1d4b255;background:#25151dcc;box-shadow:0 8px 24px #0005;backdrop-filter:blur(12px)}
.message{z-index:2;color:#f0c6a8;font-family:Georgia,serif;font-size:18px;line-height:1.7}
</style>

<style id="heartmate-candy-inspired-shorts-v2">
body{background:#09080e;color:#faf7ff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(180deg,#09080ef5,#09080e99,transparent)}
.brand{color:#ff80b8}header a{background:#17131fdd;border:1px solid #ff80b855;color:#ffd5e7;border-radius:22px}
.video-card{background:radial-gradient(circle at 50% 35%,#49243f,#09080e 72%)}
.video-card:after{background:linear-gradient(0deg,#09080ef0,transparent 48%,#09080e44)}
.overlay h2{font-family:Inter,sans-serif;font-weight:800;color:#fff}.overlay p{color:#f4dce9}
.controls button{background:#17131fcc;border:1px solid #ffffff30;border-radius:50%;backdrop-filter:blur(15px)}
.message{color:#ff9ac8;font-family:Inter,sans-serif}
</style>
</head>

<body>

<header>
  <div class="brand">♥ Heartmate Shorts</div>
  <a href="/chat.html">Back to Chat</a>
</header>

<main class="feed" id="feed">
  <div class="message" id="message">
    Your Shorts videos will appear here.
    <br><br>
    Add your MP4 videos to the Public/shorts/ folder.
  </div>
</main>

<script>
const feed = document.getElementById("feed");
const message = document.getElementById("message");
const MAX_SHORTS = 100;

async function loadShorts(){
  try {
    const response = await fetch("/shorts/videos.json", {cache:"no-store"});
    if(!response.ok) throw new Error("Could not load the Shorts list.");
    const data = await response.json();
    // Supports grouped series (each with episodes) and the older flat videos list.
    const flatVideos = Array.isArray(data)
      ? data
      : (Array.isArray(data.videos) ? data.videos : []);
    const groupedVideos = Array.isArray(data.series)
      ? data.series.flatMap(series => {
          const episodes = Array.isArray(series.episodes) ? series.episodes : [];
          return episodes.map((episode,index) => ({
            ...episode,
            name: episode.name || series.title || "Heartmate Shorts",
            caption: episode.caption || `${series.title || "Series"} · Episode ${episode.episodeNumber || index + 1}`
          }));
        })
      : [];
    const videos = groupedVideos.length ? groupedVideos : flatVideos;
    const listedVideos = videos.filter(item =>
      item &&
      typeof item.file === "string" &&
      item.file.startsWith("/shorts/") &&
      item.file.toLowerCase().endsWith(".mp4")
    ).slice(0, MAX_SHORTS);

    // Ignore episode slots until their matching MP4 files have actually been uploaded.
    const availability = await Promise.all(listedVideos.map(async item => {
      try {
        const check = await fetch(item.file, { method: "HEAD", cache: "no-store" });
        return check.ok ? item : null;
      } catch (_) {
        return null;
      }
    }));
    const validVideos = availability.filter(Boolean);

    if(!validVideos.length){
      message.textContent = "Your 10 episode slots are ready. Upload episode-01.mp4 through episode-10.mp4 into Public/shorts to make them appear here.";
      return;
    }

    message.remove();
    validVideos.forEach((item,index) => {
      const card = document.createElement("section");
      card.className = "video-card";

      const video = document.createElement("video");
      video.src = item.file;
      video.autoplay = index === 0;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.preload = index === 0 ? "metadata" : "none";

      const overlay = document.createElement("div");
      overlay.className = "overlay";
      const heading = document.createElement("h2");
      heading.textContent = item.name || "Your Companion";
      const caption = document.createElement("p");
      caption.textContent = item.caption || "A little moment just for you ♥";
      overlay.append(heading,caption);

      const controls = document.createElement("div");
      controls.className = "controls";

      const mute = document.createElement("button");
      mute.textContent = "🔇";
      mute.setAttribute("aria-label","Toggle sound");
      mute.onclick = () => {
        video.muted = !video.muted;
        mute.textContent = video.muted ? "🔇" : "🔊";
      };

      const play = document.createElement("button");
      play.textContent = "Ⅱ";
      play.setAttribute("aria-label","Play or pause");
      play.onclick = () => {
        if(video.paused){
          video.play().catch(() => {});
          play.textContent = "Ⅱ";
        }else{
          video.pause();
          play.textContent = "▶";
        }
      };

      controls.append(mute,play);
      card.append(video,overlay,controls);
      feed.append(card);
    });

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target.querySelector("video");
        const play = entry.target.querySelector('[aria-label="Play or pause"]');
        if(entry.isIntersecting){
          document.querySelectorAll(".video-card video").forEach(v => {
            if(v !== video) v.pause();
          });
          video.play().then(() => {
            if(play) play.textContent = "Ⅱ";
          }).catch(() => {});
        }else{
          video.pause();
        }
      });
    },{root:feed,threshold:0.65});

    document.querySelectorAll(".video-card").forEach(card => observer.observe(card));
  } catch(error) {
    message.textContent = "Couldn't load Shorts right now. Please refresh and try again.";
    console.error(error);
  }
}

loadShorts();
</script>

</body>
</html>
