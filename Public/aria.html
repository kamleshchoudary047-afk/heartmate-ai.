
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Aria - Heartmate AI</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .aria-page {
      max-width: 700px;
      margin: 25px auto;
      padding: 16px;
      text-align: center;
    }

    .aria-page h1 {
      margin-bottom: 8px;
    }

    .aria-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .aria-gallery img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 14px;
    }

    .back-link, .chat-link {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      border-radius: 25px;
      background: #e94d91;
      color: white;
      text-decoration: none;
    }
  </style>

<style id="heartmate-aria-premium">
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#70364a55,transparent 48%),#0d070b;color:#fff5ef;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.aria-page{max-width:980px;margin:0 auto;padding:42px 22px 60px}
.aria-page h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,54px);color:#f2c9aa}
.aria-page>p{color:#d2b9b6;line-height:1.7}
.aria-gallery{gap:16px;margin:30px 0}
.aria-gallery img{border:1px solid #e8c49a44;border-radius:20px;box-shadow:0 16px 45px #0006;transition:transform .25s}
.aria-gallery img:hover{transform:translateY(-4px)}
.back-link,.chat-link{margin:7px;padding:13px 22px;border:1px solid #f1d4b277;border-radius:28px;background:linear-gradient(115deg,#f1d4b2,#c9827d);color:#24131a;font-weight:700}
.back-link{background:#26151e;color:#f2d2bd;border-color:#e8c49a55}
@media(max-width:520px){.aria-page{padding:28px 15px 45px}.aria-gallery{gap:10px}.aria-gallery img{border-radius:14px}}
</style>
</head>
<body>

  <main class="aria-page">
    <h1>Meet Aria ❤️</h1>
    <p>Playful, flirty and always happy to chat with you.</p>

    <div class="aria-gallery">
      <img src="/images/aria-1.jpeg" alt="Aria photo 1">
      <img src="/images/aria-2.jpeg" alt="Aria photo 2">
      <img src="/images/aria-3.jpeg" alt="Aria photo 3">
      <img src="/images/aria-4.jpeg" alt="Aria photo 4">
    </div>

    <a class="chat-link" href="chat.html?girl=aria">Chat with Aria 💬</a>
    <a class="back-link" href="index.html">← Back Home</a>
  </main>

</body>
</html>
