
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet Aria - Heartmate AI</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .aria-page {
      max-width: 700px;
      margin: 25px auto;
      padding: 16px;
      text-align: center;
    }

    .aria-page h1 {
      margin-bottom: 8px;
    }

    .aria-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 24px 0;
    }

    .aria-gallery img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 14px;
    }

    .back-link, .chat-link {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      border-radius: 25px;
      background: #e94d91;
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <main class="aria-page">
    <h1>Meet Aria ❤️</h1>
    <p>Playful, flirty and always happy to chat with you.</p>

    <div class="aria-gallery">
      <img src="/images/aria-1.jpeg" alt="Aria photo 1">
      <img src="/images/aria-2.jpeg" alt="Aria photo 2">
      <img src="/images/aria-3.jpeg" alt="Aria photo 3">
      <img src="/images/aria-4.jpeg" alt="Aria photo 4">
    </div>

    <a class="chat-link" href="chat.html?girl=aria">Chat with Aria 💬</a>
    <a class="back-link" href="index.html">← Back Home</a>
  </main>

</body>
</html>
