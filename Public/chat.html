
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartmate AI - Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #17121d;
  color: white;
}

header {
  padding: 18px;
  background: #24172d;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid #49334f;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 24px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff70a6, #9b59b6);
  display: grid;
  place-items: center;
  font-size: 22px;
}

.profile h3 {
  margin: 0 0 5px;
}

.profile small {
  color: #a8e6b0;
}

#messages {
  height: calc(100dvh - 145px);
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 82%;
  padding: 13px 16px;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #35243e;
  border-bottom-left-radius: 5px;
}

.user {
  align-self: flex-end;
  background: #bd4385;
  border-bottom-right-radius: 5px;
}

#typing {
  color: #c5a9cb;
  padding: 0 18px 8px;
  font-size: 13px;
  display: none;
}

form {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: #24172d;
  display: flex;
  gap: 9px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #65466d;
  border-radius: 25px;
  background: #35243e;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 0 20px;
  background: #e34e9a;
  color: white;
  font-weight: bold;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="avatar">💗</div>
  <div class="profile">
    <h3 id="girlName">Your Heartmate</h3>
    <small>● Online</small>
  </div>
</header>

<main id="messages">
  <div class="message bot" id="welcome">
    Hey there! 💕 I'm happy you're here. How is your day going?
  </div>
</main>

<div id="typing">Your heartmate is typing...</div>

<form id="chatForm">
  <input
    id="messageInput"
    type="text"
    placeholder="Write a message..."
    autocomplete="off"
    required
  >
  <button id="sendButton" type="submit">Send</button>
</form>

<script>
const params = new URLSearchParams(window.location.search);
const character = (params.get("girl") || "aria").toLowerCase();

const names = {
  aria: "Aria",
  maya: "Maya",
  luna: "Luna",
  sofia: "Sofia",
  ella: "Ella",
  nova: "Nova",
  zara: "Zara",
  ivy: "Ivy",
  ruby: "Ruby",
  chloe: "Chloe",
  nina: "Nina",
  lila: "Lila",
  amber: "Amber",
  violet: "Violet",
  scarlett: "Scarlett",
  jade: "Jade",
  rose: "Rose",
  stella: "Stella",
  kira: "Kira",
  diana: "Diana",
  freya: "Freya",
  sienna: "Sienna",
  valentina: "Valentina",
  aurora: "Aurora"
};

const girlName = names[character] || "Aria";
document.getElementById("girlName").textContent = girlName;

const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const typing = document.getElementById("typing");

const history = [];

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = input.value.trim();
  if (!message || button.disabled) return;

  addMessage(message, "user");
  history.push({ role: "user", content: message });

  input.value = "";
  button.disabled = true;
  typing.style.display = "block";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        character: character,
        message: message,
        history: history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "The chat service is unavailable.");
    }

    const reply = data.reply;

    if (!reply) {
      throw new Error("The AI returned an empty reply.");
    }

    addMessage(reply, "bot");
    history.push({ role: "assistant", content: reply });

  } catch (error) {
    addMessage(
      "Sorry, I'm having trouble connecting right now. Please try again. (" +
      error.message + ")",
      "bot"
    );
  } finally {
    typing.style.display = "none";
    button.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
