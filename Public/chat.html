
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b1b">
<title>Heartmate AI — Chat</title>

<style>
:root {
  --bg:#100b1b;
  --panel:#1d152b;
  --pink:#ff83bd;
  --lav:#b69aff;
  --text:#fff8ff;
  --muted:#c5b5d5;
}
*{box-sizing:border-box}
body {
  margin:0;
  min-height:100dvh;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 10% 0%,#512d6a66,transparent 45%),
    radial-gradient(ellipse at 100% 40%,#a33e7550,transparent 40%),
    var(--bg);
}
header {
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:#160f23ed;
  border-bottom:1px solid #ffffff18;
  backdrop-filter:blur(18px);
}
.back {
  color:white;
  text-decoration:none;
  font-size:27px;
}
.avatar {
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#ff83bd,#9669db);
  font-size:23px;
}
.profile h3{margin:0 0 4px;font-size:15px}
.profile small{color:#8ce5ae;font-size:11px}
.relationship-card {
  margin:12px 14px 0;
  padding:12px 14px;
  border:1px solid #ff83bd35;
  border-radius:16px;
  background:linear-gradient(135deg,#2b1d3b,#211629);
}
.relationship-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:12px;
}
.relationship-name {color:#ffd1e8;font-weight:700}
.relationship-points {color:#cbb9dd;font-size:11px}
.relationship-track {
  height:7px;
  margin:9px 0 6px;
  overflow:hidden;
  border-radius:99px;
  background:#ffffff16;
}
.relationship-fill {
  width:0;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#ff83bd,#b69aff);
  transition:width .35s ease;
}
.relationship-next {
  color:#bfaed0;
  font-size:10px;
}
#account {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
}
button {
  border:0;
  color:white;
  cursor:pointer;
  font:inherit;
}
.small-button {
  padding:9px 11px;
  border:1px solid #ffffff22;
  border-radius:11px;
  background:#ffffff10;
  font-size:11px;
}
#messages {
  height:calc(100dvh - 190px);
  min-height:300px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:22px 15px 30px;
  scroll-behavior:smooth;
}
.welcome {
  max-width:320px;
  margin:12px auto;
  padding:15px;
  border:1px solid #ffffff15;
  border-radius:18px;
  background:#ffffff08;
  color:var(--muted);
  text-align:center;
  line-height:1.6;
  font-size:13px;
}
.message {
  max-width:88%;
  padding:13px 16px;
  border-radius:20px;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  animation:appear .2s ease;
}
.bot {
  align-self:flex-start;
  background:linear-gradient(145deg,#302440,#21192e);
  border:1px solid #c6a0ff25;
  border-bottom-left-radius:6px;
}
.user {
  align-self:flex-end;
  background:linear-gradient(135deg,#ed75b4,#a276e6);
  border-bottom-right-radius:6px;
}
.media {
  max-width:88%;
  padding:9px;
  border-radius:17px;
  background:#291d39;
}
.media img,.media video {
  display:block;
  width:100%;
  max-width:320px;
  border-radius:12px;
}
#typing {
  display:none;
  align-items:center;
  gap:4px;
  padding:0 18px 10px;
  color:#e8bce0;
  font-size:12px;
}
.typing-dots {
  display:inline-flex;
  align-items:center;
  gap:3px;
  margin-left:3px;
}
.typing-dots span {
  width:5px;
  height:5px;
  border-radius:50%;
  background:#ff9dcc;
  animation:typingBounce 1s infinite ease-in-out;
}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes typingBounce {
  0%,60%,100%{transform:translateY(0);opacity:.45}
  30%{transform:translateY(-4px);opacity:1}
}
.footer {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:6;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:#160f23f2;
  border-top:1px solid #ffffff19;
  backdrop-filter:blur(20px);
}
.tools {
  display:flex;
  gap:7px;
  max-width:760px;
  margin:0 auto 10px;
  overflow-x:auto;
}
.tools button {
  white-space:nowrap;
  padding:8px 11px;
  border:1px solid #ffffff20;
  border-radius:12px;
  background:#2b203b;
  font-size:11px;
}
.composer {
  display:flex;
  gap:8px;
  max-width:760px;
  margin:auto;
}
#messageInput {
  flex:1;
  min-width:0;
  height:48px;
  padding:0 14px;
  border:1px solid #c9a5ed40;
  border-radius:15px;
  outline:none;
  background:#281f36;
  color:white;
  font-size:16px;
}
#messageInput:focus {
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff83bd20;
}
.action {
  min-width:45px;
  height:46px;
  border-radius:14px;
  background:linear-gradient(135deg,#a16cdb,#d65eaa);
  font-size:19px;
}
#sendButton {
  padding:0 17px;
  background:linear-gradient(135deg,#ff83bd,#a477e9);
  font-size:13px;
  font-weight:700;
}
button:disabled{opacity:.5;cursor:wait}
#status {
  max-width:760px;
  margin:0 auto 8px;
  color:#e8bce0;
  font-size:12px;
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  background:#000b;
}
.modal.open{display:flex}
.modal-card {
  width:100%;
  max-width:480px;
  padding:20px;
  border:1px solid #d5b1f944;
  border-radius:24px;
  background:linear-gradient(145deg,#30213f,#171020);
}
.modal-card h3{margin:0 0 8px}
.modal-card p{color:var(--muted);font-size:13px;line-height:1.5}
#sceneInput {
  width:100%;
  min-height:100px;
  padding:13px;
  border:1px solid #ffffff25;
  border-radius:14px;
  background:#171020;
  color:white;
  font:14px Arial,sans-serif;
}
.modal-actions{display:flex;gap:9px;margin-top:13px}
.modal-actions button {
  flex:1;
  padding:13px;
  border-radius:13px;
  background:linear-gradient(135deg,#ed75b4,#9d6cdb);
}
.modal-actions .cancel{background:#ffffff15}
@keyframes appear {
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
@media(min-width:700px) {
  #messages {
    padding-left:max(20px,calc((100vw - 720px)/2));
    padding-right:max(20px,calc((100vw - 720px)/2));
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="avatar">💗</div>
  <div class="profile">
    <h3 id="girlName">Your Heartmate</h3>
    <small>● Here with you</small>
  </div>
  <div id="account">
    <button class="small-button" id="signIn">Sign in</button>
    <button class="small-button" id="signOut" hidden>Sign out</button>
  </div>
</header>

<section class="relationship-card" aria-label="Relationship progress">
  <div class="relationship-top">
    <span class="relationship-name" id="relationshipName">💗 New Friend · Level 1</span>
    <span class="relationship-points" id="relationshipPoints">0 affection points</span>
  </div>
  <div class="relationship-track"><div class="relationship-fill" id="relationshipFill"></div></div>
  <div class="relationship-next" id="relationshipNext">Chat to earn affection points 💗</div>
</section>

<main id="messages">
  <div class="welcome">
    Welcome to Heartmate AI 💗<br>
    A little space for conversations, sweet moments and creativity.
  </div>
</main>

<div id="typing"><span id="typingName">Your Heartmate</span> is typing <span class="typing-dots" aria-label="typing"><span></span><span></span><span></span></span> 💗</div>

<footer class="footer">
  <div class="tools">
    <button onclick="openMedia('image')">📸 Create image</button>
    <button onclick="openMedia('video')">🎬 Create video</button>
    <button onclick="toggleVoice()">🔊 Voice replies</button>
    <button onclick="toggleRecording()">🎙️ Voice input</button>
  </div>
  <div id="status"></div>
  <div class="composer">
    <input id="messageInput" placeholder="Write something sweet…" autocomplete="off">
    <button class="action" onclick="toggleRecording()" aria-label="Voice input">🎙️</button>
    <button class="action" id="sendButton">➤</button>
  </div>
</footer>

<div class="modal" id="mediaModal">
  <div class="modal-card">
    <h3 id="modalTitle">Create something lovely ✨</h3>
    <p id="modalDescription">Describe what you want to create.</p>
    <textarea id="sceneInput" placeholder="Describe your scene…"></textarea>
    <div class="modal-actions">
      <button class="cancel" onclick="closeMedia()">Cancel</button>
      <button id="createMediaButton">Create</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const names = {
  aria:"Aria",maya:"Maya",luna:"Luna",sofia:"Sofia",ella:"Ella",
  nova:"Nova",zara:"Zara",ivy:"Ivy",ruby:"Ruby",chloe:"Chloe",
  nina:"Nina",lila:"Lila",amber:"Amber",violet:"Violet",
  scarlett:"Scarlett",jade:"Jade",rose:"Rose",stella:"Stella",
  kira:"Kira",diana:"Diana",freya:"Freya",sienna:"Sienna",
  valentina:"Valentina",aurora:"Aurora",ananya:"Ananya",
  aadhya:"Aadhya",meera:"Meera",kiara:"Kiara",ishita:"Ishita",
  kavya:"Kavya",diya:"Diya",riya:"Riya",nisha:"Nisha",
  pooja:"Pooja",tara:"Tara",priya:"Priya",elena:"Elena",
  amara:"Amara",isabelle:"Isabelle",celeste:"Celeste",layla:"Layla"
};
const requested = (params.get("girl") || "aria").toLowerCase();
const character = names[requested] ? requested : "aria";
const girlName = names[character];

const $ = id => document.getElementById(id);
$("girlName").textContent = girlName;
$("typingName").textContent = girlName;

const messages = $("messages");
const input = $("messageInput");
const sendButton = $("sendButton");
const typing = $("typing");
const status = $("status");

let busy = false;
let voiceReplies = true;
let lastRelationshipLevel = null;
let bikiniUnlockPending = false;
let mediaType = "image";
let chatHistory = [];
let recorder = null;
let recordingStream = null;
let recordingChunks = [];
let userReady = Promise.resolve();

async function refreshRelationship() {
  if (!window.heartmateUser) return;
  try {
    const data = await api("/api/relationship?character=" + encodeURIComponent(character));
    const points = Number(data.affectionPoints || 0);
    const level = Number(data.level || 1);
    const levelName = data.levelName || "New Friend";
    const next = data.nextLevel;

    if (lastRelationshipLevel !== null && lastRelationshipLevel < 2 && level >= 2) {
      bikiniUnlockPending = true;
      addMessage("🎉 You reached Level 2! " + girlName + " unlocked a special bikini beach photo. 💗", "bot");
    }
    lastRelationshipLevel = level;
    $("relationshipName").textContent = "💗 " + levelName + " · Level " + level;
    $("relationshipPoints").textContent = points + " affection point" + (points === 1 ? "" : "s");

    const currentThreshold = level === 1 ? 0 : Number(data.milestones?.[level - 1]?.points || 0);
    const nextThreshold = next ? Number(next.points) : 500;
    const progress = next ? Math.max(0, Math.min(100, ((points-currentThreshold)/(nextThreshold-currentThreshold))*100)) : 100;
    $("relationshipFill").style.width = progress + "%";
    $("relationshipNext").textContent = next
      ? (data.pointsToNextLevel + " points to " + next.name + " ✨")
      : "You've reached Soulmate level! 💗";
  } catch (error) {
    $("relationshipNext").textContent = "Sign in and chat to track your bond.";
  }
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addImage(url) {
  const box = document.createElement("div");
  box.className = "media";
  const img = document.createElement("img");
  img.src = url;
  img.alt = girlName + " generated image";
  box.appendChild(img);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
}

function addVideo(url) {
  const box = document.createElement("div");
  box.className = "media";
  const video = document.createElement("video");
  video.src = url;
  video.controls = true;
  video.playsInline = true;
  box.appendChild(video);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
}

async function authToken() {
  await userReady;
  if (!window.heartmateUser) {
    throw new Error("Please sign in with Google first.");
  }
  return window.heartmateUser.getIdToken();
}

async function api(path, options = {}) {
  const token = await authToken();
  const headers = {
    ...(options.headers || {}),
    Authorization: "Bearer " + token
  };

  if (options.body && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(path, {...options, headers});
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Request failed.");
  }
  return data;
}

/* CHAT */

async function sendChat() {
  const message = input.value.trim();
  if (!message || busy) return;

  if (!window.heartmateUser) {
    addMessage("Please sign in with Google before chatting. 💗", "bot");
    return;
  }

  busy = true;
  sendButton.disabled = true;
  addMessage(message, "user");
  chatHistory.push({role:"user", content:message});
  input.value = "";
  typing.style.display = "block";

  try {
    const data = await api("/api/chat", {
      method:"POST",
      body:JSON.stringify({
        character,
        message,
        history:chatHistory
      })
    });

    if (!data.reply) throw new Error("The AI returned an empty reply.");

    addMessage(data.reply, "bot");
    chatHistory.push({role:"assistant", content:data.reply});

    await refreshRelationship();
    if (voiceReplies) speak(data.reply);
  } catch (error) {
    addMessage("Sorry, I couldn't connect. " + error.message, "bot");
  } finally {
    busy = false;
    sendButton.disabled = false;
    typing.style.display = "none";
    input.focus();

    if (bikiniUnlockPending) {
      bikiniUnlockPending = false;
      generateImage("wearing a stylish, tasteful bikini at a sunny beach, full-body fashion editorial, confident relaxed pose, non-explicit swimwear portrait");
    }
  }
}

sendButton.addEventListener("click", sendChat);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendChat();
  }
});

/* IMAGE AND VIDEO */

function openMedia(type) {
  mediaType = type;
  $("modalTitle").textContent =
    type === "video" ? "Create a video 🎬" : "Create an image 📸";
  $("modalDescription").textContent =
    "Describe the scene you want for " + girlName + ".";
  $("sceneInput").value = "";
  $("mediaModal").classList.add("open");
}

function closeMedia() {
  $("mediaModal").classList.remove("open");
}

$("createMediaButton").addEventListener("click", async () => {
  const scene = $("sceneInput").value.trim();
  if (!scene || busy) return;

  closeMedia();

  if (mediaType === "video") {
    if (!confirm("Video generation may use paid credits. Continue?")) return;
    await generateVideo(scene);
  } else {
    await generateImage(scene);
  }
});

async function generateImage(scene) {
  if (busy) return;
  busy = true;
  status.textContent = "Creating your image…";

  try {
    const token = await authToken();
    const response = await fetch("/api/image", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + token
      },
      body:JSON.stringify({character, scene})
    });

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "Image creation failed.");
    }

    const blob = await response.blob();
    if (!blob.type.startsWith("image/")) {
      throw new Error("The server did not return an image.");
    }

    addImage(URL.createObjectURL(blob));
  } catch (error) {
    addMessage("Image creation failed: " + error.message, "bot");
  } finally {
    busy = false;
    status.textContent = "";
  }
}

async function generateVideo(scene) {
  if (busy) return;
  busy = true;
  status.textContent = "Preparing your video…";

  try {
    const token = await authToken();
    const response = await fetch("/api/video", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + token
      },
      body:JSON.stringify({character, scene})
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || !data.taskId) {
      throw new Error(data.error || "Video generation could not start.");
    }

    addMessage("Your video is being created. Please wait… 💗", "bot");

    for (let i = 0; i < 60; i++) {
      await new Promise(resolve => setTimeout(resolve, 5000));

      const result = await fetch(
        "/api/video/status?taskId=" + encodeURIComponent(data.taskId),
        {headers:{Authorization:"Bearer " + token}}
      );

      const progress = await result.json().catch(() => ({}));

      if (progress.status === "succeeded" && progress.videoUrl) {
        addVideo(progress.videoUrl);
        return;
      }

      if (progress.status === "failed") {
        throw new Error(progress.message || "Video generation failed.");
      }
    }

    addMessage("The video is taking longer than expected.", "bot");
  } catch (error) {
    addMessage("Video creation failed: " + error.message, "bot");
  } finally {
    busy = false;
    status.textContent = "";
  }
}

/* VOICE REPLIES */

function toggleVoice() {
  voiceReplies = !voiceReplies;
  addMessage(
    "Voice replies " + (voiceReplies ? "enabled 🔊" : "disabled"),
    "bot"
  );
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1.05;

  window.speechSynthesis.speak(utterance);
}

/* VOICE RECORDING */

async function toggleRecording() {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
    status.textContent = "Processing your voice…";
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    addMessage("Voice recording isn't supported in this browser.", "bot");
    return;
  }

  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({audio:true});
    recordingChunks = [];

    const preferredTypes = [
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm"
    ];

    const mimeType = preferredTypes.find(type =>
      MediaRecorder.isTypeSupported(type)
    );

    recorder = mimeType
      ? new MediaRecorder(recordingStream, {mimeType})
      : new MediaRecorder(recordingStream);

    recorder.ondataavailable = event => {
      if (event.data.size) recordingChunks.push(event.data);
    };

    recorder.onstop = async () => {
      recordingStream.getTracks().forEach(track => track.stop());
      recordingStream = null;

      const blob = new Blob(recordingChunks, {
        type:recorder.mimeType || "audio/webm"
      });

      if (!blob.size) {
        status.textContent = "";
        return;
      }

      if (blob.size > 2 * 1024 * 1024) {
        status.textContent = "";
        addMessage("That recording is too large. Try a shorter message.", "bot");
        return;
      }

      try {
        const token = await authToken();
        const response = await fetch("/api/transcribe", {
          method:"POST",
          headers:{
            Authorization:"Bearer " + token,
            "Content-Type":blob.type
          },
          body:blob
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Transcription failed.");
        }

        input.value = data.text || data.transcript || "";

        if (!input.value) {
          throw new Error("No speech was detected.");
        }

        input.focus();
        status.textContent = "Voice converted to text. Tap Send.";
      } catch (error) {
        status.textContent = "";
        addMessage("Voice transcription failed: " + error.message, "bot");
      }
    };

    recorder.start();
    status.textContent = "Recording… tap the microphone again to finish.";

    setTimeout(() => {
      if (recorder && recorder.state === "recording") {
        recorder.stop();
      }
    }, 30000);

  } catch (error) {
    if (recordingStream) {
      recordingStream.getTracks().forEach(track => track.stop());
      recordingStream = null;
    }
    addMessage("Please allow microphone access to record.", "bot");
  }
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeMedia();
});

</script>

const logout = document.getElementById("signOut");

login.addEventListener("click", async () => {
  login.disabled = true;

  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    alert("Google sign-in failed: " + error.message);
  } finally {
    login.disabled = false;
  }
});

logout.addEventListener("click", async () => {
  logout.disabled = true;

  try {
    await signOut(auth);
  } catch (error) {
    alert("Sign-out failed: " + error.message);
  } finally {
    logout.disabled = false;
  }
});

onAuthStateChanged(auth, currentUser => {
  window.heartmateUser = currentUser;

  login.hidden = !!currentUser;
  logout.hidden = !currentUser;

  if (currentUser) {
    refreshRelationship();
    document.querySelector(".profile small").textContent =
      "● Signed in · Here with you";
  } else {
    document.querySelector(".profile small").textContent =
      "● Here with you";
  }
});
</script>

</body>
</html>
