
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartmate AI - Chat</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #17121d;
  color: white;
}

header {
  padding: 18px;
  background: #24172d;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid #49334f;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 24px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff70a6, #9b59b6);
  display: grid;
  place-items: center;
  font-size: 22px;
}

.profile h3 { margin: 0 0 5px; }
.profile small { color: #a8e6b0; }

#messages {
  height: calc(100dvh - 235px);
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #35243e;
  border-bottom-left-radius: 5px;
}

.user {
  align-self: flex-end;
  background: #bd4385;
  border-bottom-right-radius: 5px;
}

.image-message {
  max-width: 88%;
  padding: 10px;
  background: #35243e;
  border-radius: 16px;
  align-self: flex-start;
}

.image-message img {
  display: block;
  width: 100%;
  max-width: 300px;
  border-radius: 12px;
}

#typing {
  color: #c5a9cb;
  padding: 0 18px 8px;
  font-size: 13px;
  display: none;
}

.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px;
  background: #24172d;
  border-top: 1px solid #49334f;
}

#photoForm, #chatForm {
  display: flex;
  gap: 8px;
  margin-bottom: 9px;
}

#chatForm { margin-bottom: 0; }

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #65466d;
  border-radius: 25px;
  background: #35243e;
  color: white;
  font-size: 15px;
  outline: none;
}

button {
  border: 0;
  border-radius: 25px;
  padding: 0 16px;
  background: #e34e9a;
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

#photoButton {
  background: #8052a3;
}

button:disabled {
  opacity: 0.5;
  cursor: wait;
}

#photoStatus {
  color: #d9bde3;
  font-size: 12px;
  padding: 0 8px 7px;
  display: none;
}

@media (max-width: 380px) {
  button { padding: 0 11px; }
  input { font-size: 14px; }
}
</style>
</head>

<body>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="avatar">💗</div>
  <div class="profile">
    <h3 id="girlName">Your Heartmate</h3>
    <small>● Online</small>
  </div>
</header>

<main id="messages">
  <div class="message bot">
    Hey there! 💕 I'm happy you're here. How is your day going?
  </div>
</main>

<div class="footer">

  <div id="photoStatus">Creating your picture... Please wait.</div>

  <form id="photoForm">
    <input
      id="sceneInput"
      type="text"
      placeholder="Describe Aria's photo scene..."
      autocomplete="off"
    >
    <button id="photoButton" type="submit">
      📸 Create
    </button>
  </form>

  <form id="chatForm">
    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
      autocomplete="off"
      required
    >
    <button id="sendButton" type="submit">Send</button>
  </form>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const character = (params.get("girl") || "aria").toLowerCase();

const names = {
  aria: "Aria",
  maya: "Maya",
  luna: "Luna",
  sofia: "Sofia",
  ella: "Ella",
  nova: "Nova",
  zara: "Zara",
  ivy: "Ivy",
  ruby: "Ruby",
  chloe: "Chloe",
  nina: "Nina",
  lila: "Lila",
  amber: "Amber",
  violet: "Violet",
  scarlett: "Scarlett",
  jade: "Jade",
  rose: "Rose",
  stella: "Stella",
  kira: "Kira",
  diana: "Diana",
  freya: "Freya",
  sienna: "Sienna",
  valentina: "Valentina",
  aurora: "Aurora"
};

const girlName = names[character] || "Aria";

document.getElementById("girlName").textContent = girlName;

const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");

const photoForm = document.getElementById("photoForm");
const sceneInput = document.getElementById("sceneInput");
const photoButton = document.getElementById("photoButton");
const photoStatus = document.getElementById("photoStatus");

const history = [];

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;
  messages.appendChild(div);
  scrollToBottom();
}

function addImage(imageUrl, description) {
  const box = document.createElement("div");
  box.className = "image-message";

  const caption = document.createElement("div");
  caption.textContent = "💕 " + description;

  const image = document.createElement("img");
  image.src = imageUrl;
  image.alt = girlName + " generated picture";
  image.loading = "lazy";

  box.appendChild(caption);
  box.appendChild(image);
  messages.appendChild(box);

  scrollToBottom();
}

// Normal AI chat.
form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = input.value.trim();
  if (!message || button.disabled) return;

  addMessage(message, "user");
  history.push({ role: "user", content: message });

  input.value = "";
  button.disabled = true;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        character: character,
        message: message,
        history: history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Chat service unavailable.");
    }

    const reply = data.reply;

    if (!reply) {
      throw new Error("The AI returned an empty reply.");
    }

    addMessage(reply, "bot");
    history.push({ role: "assistant", content: reply });

  } catch (error) {
    addMessage(
      "Sorry, I'm having trouble connecting. " + error.message,
      "bot"
    );
  } finally {
    button.disabled = false;
    input.focus();
  }
});

// New scene-specific image generation.
photoForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const scene = sceneInput.value.trim();

  if (!scene || photoButton.disabled) return;

  if (character !== "aria") {
    addMessage(
      "New photo generation is currently being tested with Aria only. 💗",
      "bot"
    );
    return;
  }

  addMessage("Create a new picture: " + scene, "user");

  photoButton.disabled = true;
  sceneInput.disabled = true;
  photoStatus.style.display = "block";

  try {
    const response = await fetch("/api/image", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        character: "aria",
        scene: scene
      })
    });

    if (!response.ok) {
      let errorMessage = "Image generation failed.";

      try {
        const data = await response.json();
        errorMessage = data.error || errorMessage;
      } catch (_) {}

      throw new Error(errorMessage);
    }

    const imageBlob = await response.blob();

    if (!imageBlob.type.startsWith("image/")) {
      throw new Error("The server did not return a valid image.");
    }

    const imageUrl = URL.createObjectURL(imageBlob);

    addImage(imageUrl, "A new picture of Aria");

    sceneInput.value = "";

  } catch (error) {
    addMessage(
      "I couldn't create that picture. " + error.message,
      "bot"
    );
  } finally {
    photoButton.disabled = false;
    sceneInput.disabled = false;
    photoStatus.style.display = "none";
    sceneInput.focus();
  }
});
</script>

</body>
</html>
