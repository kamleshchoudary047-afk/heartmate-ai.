
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b1b">
<title>Heartmate AI — Chat</title>
<style>
:root {
  --bg:#100b1b;
  --panel:#1d152b;
  --panel2:#291d39;
  --pink:#ff83bd;
  --lav:#b69aff;
  --text:#fff8ff;
  --muted:#c5b5d5;
}
*{box-sizing:border-box}
body {
  margin:0;
  min-height:100dvh;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(ellipse at 10% 0%,#512d6a66,transparent 45%),
    radial-gradient(ellipse at 100% 40%,#a33e7550,transparent 40%),
    var(--bg);
}
header {
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  padding-top:max(14px,env(safe-area-inset-top));
  background:#160f23eF;
  border-bottom:1px solid #ffffff18;
  backdrop-filter:blur(18px);
}
.back {
  color:white;
  text-decoration:none;
  font-size:27px;
}
.avatar {
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#ff83bd,#9669db);
  font-size:23px;
}
.profile h3{margin:0 0 4px;font-size:15px}
.profile small{color:#8ce5ae;font-size:11px}
#account {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
}
button {
  border:0;
  color:white;
  cursor:pointer;
  font:inherit;
}
.small-button {
  padding:9px 11px;
  border:1px solid #ffffff22;
  border-radius:11px;
  background:#ffffff10;
  font-size:11px;
}
#messages {
  height:calc(100dvh - 190px);
  min-height:300px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:22px 15px 30px;
  scroll-behavior:smooth;
}
.welcome {
  max-width:320px;
  margin:12px auto;
  padding:15px;
  border:1px solid #ffffff15;
  border-radius:18px;
  background:#ffffff08;
  color:var(--muted);
  text-align:center;
  line-height:1.6;
  font-size:13px;
}
.message {
  max-width:88%;
  padding:13px 16px;
  border-radius:20px;
  font-size:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  animation:appear .2s ease;
}
.bot {
  align-self:flex-start;
  background:linear-gradient(145deg,#302440,#21192e);
  border:1px solid #c6a0ff25;
  border-bottom-left-radius:6px;
}
.user {
  align-self:flex-end;
  background:linear-gradient(135deg,#ed75b4,#a276e6);
  border-bottom-right-radius:6px;
}
.media {
  max-width:88%;
  padding:9px;
  border-radius:17px;
  background:var(--panel2);
}
.media img,.media video {
  display:block;
  width:100%;
  max-width:320px;
  border-radius:12px;
}
#typing {
  display:none;
  padding:0 18px 10px;
  color:#e8bce0;
  font-size:12px;
}
.footer {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:6;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:#160f23f2;
  border-top:1px solid #ffffff19;
  backdrop-filter:blur(20px);
}
.tools {
  display:flex;
  gap:7px;
  max-width:760px;
  margin:0 auto 10px;
  overflow-x:auto;
}
.tools button {
  white-space:nowrap;
  padding:8px 11px;
  border:1px solid #ffffff20;
  border-radius:12px;
  background:#2b203b;
  font-size:11px;
}
.composer {
  display:flex;
  gap:8px;
  max-width:760px;
  margin:auto;
}
#messageInput {
  flex:1;
  min-width:0;
  height:48px;
  padding:0 14px;
  border:1px solid #c9a5ed40;
  border-radius:15px;
  outline:none;
  background:#281f36;
  color:white;
  font-size:16px;
}
#messageInput:focus {
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff83bd20;
}
.action {
  min-width:45px;
  height:46px;
  border-radius:14px;
  background:linear-gradient(135deg,#a16cdb,#d65eaa);
  font-size:19px;
}
#sendButton {
  padding:0 17px;
  background:linear-gradient(135deg,#ff83bd,#a477e9);
  font-size:13px;
  font-weight:700;
}
#status {
  max-width:760px;
  margin:0 auto 8px;
  color:#e8bce0;
  font-size:12px;
}
.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
  background:#000b;
}
.modal.open{display:flex}
.modal-card {
  width:100%;
  max-width:480px;
  padding:20px;
  border:1px solid #d5b1f944;
  border-radius:24px;
  background:linear-gradient(145deg,#30213f,#171020);
}
.modal-card h3{margin:0 0 8px}
.modal-card p{color:var(--muted);font-size:13px;line-height:1.5}
#sceneInput {
  width:100%;
  min-height:100px;
  padding:13px;
  border:1px solid #ffffff25;
  border-radius:14px;
  background:#171020;
  color:white;
  font:14px inherit;
}
.modal-actions{display:flex;gap:9px;margin-top:13px}
.modal-actions button {
  flex:1;
  padding:13px;
  border-radius:13px;
  background:linear-gradient(135deg,#ed75b4,#9d6cdb);
}
.modal-actions .cancel{background:#ffffff15}
@keyframes appear {
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:translateY(0)}
}
@media(min-width:700px) {
  #messages {
    padding-left:max(20px,calc((100vw - 720px)/2));
    padding-right:max(20px,calc((100vw - 720px)/2));
  }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="avatar">💗</div>
  <div class="profile">
    <h3 id="girlName">Your Heartmate</h3>
    <small>● Here with you</small>
  </div>
  <div id="account">
    <button class="small-button" id="signIn">Sign in</button>
    <button class="small-button" id="signOut" hidden>Sign out</button>
  </div>
</header>

<main id="messages">
  <div class="welcome">
    Welcome to Heartmate AI 💗<br>
    A little space for conversations, sweet moments and creativity.
  </div>
</main>

<div id="typing">Your Heartmate is typing… 💗</div>

<footer class="footer">
  <div class="tools">
    <button onclick="openMedia('image')">📸 Create image</button>
    <button onclick="openMedia('video')">🎬 Create video</button>
    <button onclick="toggleVoice()">🔊 Voice replies</button>
    <button onclick="recordVoice()">🎙️ Voice input</button>
  </div>
  <div id="status"></div>
  <div class="composer">
    <input id="messageInput" placeholder="Write something sweet…" autocomplete="off">
    <button class="action" onclick="recordVoice()" aria-label="Voice input">🎙️</button>
    <button class="action" id="sendButton">➤</button>
  </div>
</footer>

<div class="modal" id="mediaModal">
  <div class="modal-card">
    <h3 id="modalTitle">Create something lovely ✨</h3>
    <p id="modalDescription">Describe what you want to create.</p>
    <textarea id="sceneInput" placeholder="Describe your scene…"></textarea>
    <div class="modal-actions">
      <button class="cancel" onclick="closeMedia()">Cancel</button>
      <button id="createMediaButton">Create</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const names = {
  aria:"Aria",maya:"Maya",luna:"Luna",sofia:"Sofia",
  ella:"Ella",nova:"Nova",zara:"Zara",ivy:"Ivy",
  ruby:"Ruby",chloe:"Chloe",nina:"Nina",rose:"Rose"
};
const requested = (params.get("girl") || "aria").toLowerCase();
const character = names[requested] ? requested : "aria";
const girlName = names[character];

document.getElementById("girlName").textContent = girlName;

const $ = id => document.getElementById(id);
const messages = $("messages");
const input = $("messageInput");
const sendButton = $("sendButton");
const typing = $("typing");
const status = $("status");

let user = null;
let busy = false;
let voiceReplies = true;
let mediaType = "image";
let chatHistory = [];
let recorder = null;

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addImage(url) {
  const box = document.createElement("div");
  box.className = "media";
  const img = document.createElement("img");
  img.src = url;
  img.alt = girlName + " generated image";
  box.appendChild(img);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
}

function addVideo(url) {
  const box = document.createElement("div");
  box.className = "media";
  const video = document.createElement("video");
  video.src = url;
  video.controls = true;
  video.playsInline = true;
  box.appendChild(video);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
}

async function authToken() {
  if (!user) throw new Error("Please sign in with Google first.");
  return user.getIdToken();
}

async function api(path, options = {}) {
  const token = await authToken();
  const headers = {
    ...(options.headers || {}),
    Authorization: "Bearer " + token
  };
  if (options.body && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }
  const response = await fetch(path, {...options, headers});
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}

async function sendChat() {
  const message = input.value.trim();
  if (!message || busy) return;

  if (!user) {
    addMessage("Please sign in with Google before chatting. 💗", "bot");
    return;
  }

  busy = true;
  sendButton.disabled = true;
  addMessage(message, "user");
  chatHistory.push({role:"user", content:message});
  input.value = "";
  typing.style.display = "block";

  try {
    const data = await api("/api/chat", {
      method:"POST",
      body:JSON.stringify({
        character,
        message,
        history:chatHistory
      })
    });

    if (!data.reply) throw new Error("The AI returned an empty reply.");

    addMessage(data.reply, "bot");
    chatHistory.push({role:"assistant", content:data.reply});
    if (voiceReplies) speak(data.reply);
  } catch (error) {
    addMessage("Sorry, I couldn't connect. " + error.message, "bot");
  } finally {
    busy = false;
    sendButton.disabled = false;
    typing.style.display = "none";
    input.focus();
  }
}

sendButton.addEventListener("click", sendChat);
input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendChat();
  }
});

function openMedia(type) {
  mediaType = type;
  $("modalTitle").textContent =
    type === "video" ? "Create a video 🎬" : "Create an image 📸";
  $("modalDescription").textContent =
    "Describe the scene you want for " + girlName + ".";
  $("sceneInput").value = "";
  $("mediaModal").classList.add("open");
}

function closeMedia() {
  $("mediaModal").classList.remove("open");
}

$("createMediaButton").addEventListener("click", async () => {
  const scene = $("sceneInput").value.trim();
  if (!scene || busy) return;

  closeMedia();
  if (mediaType === "video") {
    if (!confirm("Video generation may use paid credits. Continue?")) return;
    await generateVideo(scene);
  } else {
    await generateImage(scene);
  }
});

async function generateImage(scene) {
  if (busy) return;
  busy = true;
  status.textContent = "Creating your image…";

  try {
    const token = await authToken();
    const response = await fetch("/api/image", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + token
      },
      body:JSON.stringify({character, scene})
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "Image creation failed.");
    }
    const blob = await response.blob();
    if (!blob.type.startsWith("image/")) {
      throw new Error("The server did not return an image.");
    }
    addImage(URL.createObjectURL(blob));
  } catch (error) {
    addMessage("Image creation failed: " + error.message, "bot");
  } finally {
    busy = false;
    status.textContent = "";
  }
}

async function generateVideo(scene) {
  if (busy) return;
  busy = true;
  status.textContent = "Preparing your video…";

  try {
    const token = await authToken();
    const response = await fetch("/api/video", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + token
      },
      body:JSON.stringify({character, scene})
    });
    const data = await response.json();
    if (!response.ok || !data.taskId) {
      throw new Error(data.error || "Video generation could not start.");
    }

    addMessage("Your video is being created. Please wait… 💗", "bot");

    for (let i = 0; i < 60; i++) {
      await new Promise(resolve => setTimeout(resolve, 5000));
      const result = await fetch(
        "/api/video/status?taskId=" + encodeURIComponent(data.taskId),
        {headers:{Authorization:"Bearer " + token}}
      );
      const progress = await result.json();

      if (progress.status === "succeeded" && progress.videoUrl) {
        addVideo(progress.videoUrl);
        return;
      }
      if (progress.status === "failed") {
        throw new Error(progress.message || "Video generation failed.");
      }
    }
    addMessage("The video is taking longer than expected.", "bot");
  } catch (error) {
    addMessage("Video creation failed: " + error.message, "bot");
  } finally {
    busy = false;
    status.textContent = "";
  }
}

function toggleVoice() {
  voiceReplies = !voiceReplies;
  addMessage("Voice replies " + (voiceReplies ? "enabled 🔊" : "disabled"), "bot");
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 1;
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

async function recordVoice() {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    addMessage("Voice recording isn't supported in this browser.", "bot");
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    const chunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size) chunks.push(event.data);
    };

    recorder.onstop = async () => {
      stream.getTracks().forEach(track => track.stop());
      const blob = new Blob(chunks, {type:recorder.mimeType || "audio/webm"});
      if (!blob.size) return;

      try {
        const token = await authToken();
        const response = await fetch("/api/transcribe", {
          method:"POST",
          headers:{
            Authorization:"Bearer " + token,
            "Content-Type":blob.type
          },
          body:blob
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Transcription failed.");
        input.value = data.text || data.transcript || "";
        input.focus();
      } catch (error) {
        addMessage("Voice transcription failed: " + error.message, "bot");
      }
    };

    recorder.start();
    status.textContent = "Recording… tap the microphone again to finish.";
    setTimeout(() => {
      if (recorder && recorder.state === "recording") recorder.stop();
      status.textContent = "";
    }, 30000);

    recorder.onstop = recorder.onstop;
    $("messageInput").placeholder = "Recording…";
    $("messageInput").onfocus = () => {
      if (recorder && recorder.state === "recording") recorder.stop();
    };
  } catch (error) {
    addMessage("Please allow microphone access to record.", "bot");
  }
}
</script>

<script type="module">
import {initializeApp, getApps}
  from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyDUMIUJGsF2HCkibwIJOV3G8sQIGh0EQoo",
  authDomain:"heartmate-ai-bd441.firebaseapp.com",
  projectId:"heartmate-ai-bd441",
  storageBucket:"heartmate-ai-bd441.firebasestorage.app",
  messagingSenderId:"929844208432",
  appId:"1:929844208432:web:0afdab16bd82f11240def5",
  measurementId:"G-L0Z6XE8R8B"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const login = document.getElementById("signIn");
const logout = document.getElementById("signOut");

login.addEventListener("click", async () => {
  login.disabled = true;
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    alert("Google sign-in failed: " + error.message);
  } finally {
    login.disabled = false;
  }
});

logout.addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    alert("Sign-out failed: " + error.message);
  }
});

onAuthStateChanged(auth, currentUser => {
  window.user = currentUser;
  login.hidden = !!currentUser;
  logout.hidden = !currentUser;
});
</script>
</body>
</html>
