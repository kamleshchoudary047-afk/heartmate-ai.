
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartmate AI - Chat</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: Arial,sans-serif;
  background: #17121d; color: white;
}
header {
  padding: 18px; background: #24172d;
  display: flex; align-items: center; gap: 14px;
  border-bottom: 1px solid #49334f;
}
.back { color:white; text-decoration:none; font-size:24px; }
.avatar {
  width:45px; height:45px; border-radius:50%;
  background:linear-gradient(135deg,#ff70a6,#9b59b6);
  display:grid; place-items:center; font-size:22px;
}
.profile h3 { margin:0 0 5px; }
.profile small { color:#a8e6b0; }
#messages {
  height:calc(100dvh - 265px); overflow-y:auto;
  padding:18px; display:flex; flex-direction:column; gap:14px;
}
.message {
  max-width:85%; padding:13px 16px; border-radius:18px;
  line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere;
}
.bot { align-self:flex-start; background:#35243e; border-bottom-left-radius:5px; }
.user { align-self:flex-end; background:#bd4385; border-bottom-right-radius:5px; }
.image-message {
  max-width:88%; padding:10px; background:#35243e;
  border-radius:16px; align-self:flex-start;
}
.image-message img,.image-message video {
  display:block; width:100%; max-width:300px; border-radius:12px;
}
#typing { color:#c5a9cb; padding:0 18px 8px; font-size:13px; display:none; }
.footer {
  position:fixed; bottom:0; left:0; right:0;
  padding:10px; background:#24172d;
  border-top:1px solid #49334f;
}
form { display:flex; gap:8px; margin-bottom:9px; }
#chatForm { margin-bottom:0; }
input {
  flex:1; min-width:0; padding:13px;
  border:1px solid #65466d; border-radius:25px;
  background:#35243e; color:white; font-size:15px; outline:none;
}
button {
  border:0; border-radius:25px; padding:0 14px;
  background:#e34e9a; color:white; font-weight:bold;
  font-size:13px; cursor:pointer;
}
button:disabled { opacity:.5; cursor:wait; }
#photoButton { background:#8052a3; }
#videoButton { background:#b44b83; }
#photoStatus,#videoStatus {
  color:#d9bde3; font-size:12px;
  padding:0 8px 7px; display:none;
}
@media(max-width:380px) {
  button { padding:0 9px; }
  input { font-size:14px; }
}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="avatar">💗</div>
  <div class="profile">
    <h3 id="girlName">Your Heartmate</h3>
    <small>● Online</small>
  </div>
</header>

<main id="messages">
  <div class="message bot">
    Hey there! 💕 I'm happy you're here. How is your day going?
  </div>
</main>

<div id="typing">Thinking... 💗</div>

<div class="footer">
  <div id="photoStatus">Creating your picture... Please wait.</div>
  <div id="videoStatus">Creating your video... This may take a few minutes.</div>

  <form id="photoForm">
    <input id="sceneInput" type="text"
      placeholder="Describe Aria's photo scene..." autocomplete="off">
    <button id="photoButton" type="submit">📸 Image</button>
  </form>

  <form id="videoForm">
    <input id="videoSceneInput" type="text"
      placeholder="Describe Aria's video scene..." autocomplete="off">
    <button id="videoButton" type="submit">🎬 Video</button>
  </form>

  <form id="chatForm">
    <input id="messageInput" type="text"
      placeholder="Write a message..." autocomplete="off" required>
    <button id="sendButton" type="submit">Send</button>
  </form>
</div>

<script>
const params = new URLSearchParams(location.search);
const character = (params.get("girl") || "aria").toLowerCase();

const names = {
  aria:"Aria",maya:"Maya",luna:"Luna",sofia:"Sofia",
  ella:"Ella",nova:"Nova",zara:"Zara",ivy:"Ivy",
  ruby:"Ruby",chloe:"Chloe",nina:"Nina",lila:"Lila",
  amber:"Amber",violet:"Violet",scarlett:"Scarlett",
  jade:"Jade",rose:"Rose",stella:"Stella",kira:"Kira",
  diana:"Diana",freya:"Freya",sienna:"Sienna",
  valentina:"Valentina",aurora:"Aurora"
};

const girlName = names[character] || "Aria";
document.getElementById("girlName").textContent = girlName;

const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const button = document.getElementById("sendButton");
const typing = document.getElementById("typing");

const photoForm = document.getElementById("photoForm");
const sceneInput = document.getElementById("sceneInput");
const photoButton = document.getElementById("photoButton");
const photoStatus = document.getElementById("photoStatus");

const videoForm = document.getElementById("videoForm");
const videoSceneInput = document.getElementById("videoSceneInput");
const videoButton = document.getElementById("videoButton");
const videoStatus = document.getElementById("videoStatus");

const history = [];
let busy = false;

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(text,sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  div.textContent = text;
  messages.appendChild(div);
  scrollToBottom();
}

function addImage(url,description) {
  const box = document.createElement("div");
  box.className = "image-message";

  const caption = document.createElement("div");
  caption.textContent = "💕 " + description;

  const image = document.createElement("img");
  image.src = url;
  image.alt = girlName + " generated picture";
  image.loading = "lazy";

  box.append(caption,image);
  messages.appendChild(box);
  scrollToBottom();
}

function addVideo(url,description) {
  const box = document.createElement("div");
  box.className = "image-message";

  const caption = document.createElement("div");
  caption.textContent = "💕 " + description;

  const video = document.createElement("video");
  video.src = url;
  video.controls = true;
  video.playsInline = true;
  video.preload = "metadata";

  box.append(caption,video);
  messages.appendChild(box);
  scrollToBottom();
}

function detectMediaRequest(message) {
  const text = message.toLowerCase();

  const videoWords = /\b(video|clip|movie|animation)\b/.test(text);
  const imageWords = /\b(photo|picture|image|selfie|portrait)\b/.test(text);
  const requestWords = /\b(send|show|make|create|generate|give|share|want|need|draw)\b/.test(text);

  if (videoWords && requestWords) return "video";
  if (imageWords && requestWords) return "image";
  return "";
}

// CHAT
form.addEventListener("submit",async event => {
  event.preventDefault();

  const message = input.value.trim();
  if (!message || busy) return;

  const mediaType = detectMediaRequest(message);

  if (mediaType) {
    const confirmed = confirm(
      mediaType === "video"
        ? "Would you like Aria to create a video based on your request? Video generation may use paid Kling credits."
        : "Would you like Aria to create a picture based on your request?"
    );

    if (confirmed) {
      addMessage(message,"user");
      input.value = "";

      if (mediaType === "video") {
        await generateVideo(message);
      } else {
        await generateImage(message);
      }
      return;
    }
  }

  addMessage(message,"user");
  history.push({role:"user",content:message});
  input.value = "";
  busy = true;
  button.disabled = true;
  typing.style.display = "block";

  try {
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        character,
        message,
        history
      })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Chat unavailable.");

    const reply = data.reply;
    if (!reply) throw new Error("Empty AI response.");

    addMessage(reply,"bot");
    history.push({role:"assistant",content:reply});

  } catch(error) {
    addMessage("Sorry, I'm having trouble connecting. "+error.message,"bot");
  } finally {
    busy = false;
    button.disabled = false;
    typing.style.display = "none";
    input.focus();
  }
});

// IMAGE GENERATION
async function generateImage(scene) {
  if (character !== "aria") {
    addMessage("Picture generation is currently being tested with Aria only. 💗","bot");
    return;
  }

  if (photoButton.disabled || busy) return;

  busy = true;
  photoButton.disabled = true;
  videoButton.disabled = true;
  sceneInput.disabled = true;
  photoStatus.style.display = "block";

  try {
    const response = await fetch("/api/image",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({character:"aria",scene})
    });

    if (!response.ok) {
      const data = await response.json();
      throw new Error(data.error || "Image generation failed.");
    }

    const blob = await response.blob();
    if (!blob.type.startsWith("image/")) {
      throw new Error("Invalid image returned.");
    }

    const imageUrl = URL.createObjectURL(blob);
    addImage(imageUrl,"A new picture of Aria");

  } catch(error) {
    addMessage("I couldn't create that picture. "+error.message,"bot");
  } finally {
    busy = false;
    photoButton.disabled = false;
    videoButton.disabled = false;
    sceneInput.disabled = false;
    photoStatus.style.display = "none";
  }
}

photoForm.addEventListener("submit",async event => {
  event.preventDefault();
  const scene = sceneInput.value.trim();
  if (!scene || busy) return;

  if (!confirm("Create this picture of Aria?")) return;

  addMessage("Create a new picture: "+scene,"user");
  sceneInput.value = "";
  await generateImage(scene);
});

// VIDEO GENERATION
async function generateVideo(scene) {
  if (character !== "aria") {
    addMessage("Video generation is currently available for Aria only. 💗","bot");
    return;
  }

  if (busy) return;

  busy = true;
  videoButton.disabled = true;
  photoButton.disabled = true;
  videoSceneInput.disabled = true;
  videoStatus.style.display = "block";

  try {
    addMessage("🎬 Aria is preparing your video. Please wait...","bot");

    const response = await fetch("/api/video",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({character:"aria",scene})
    });

    const data = await response.json();

    if (!response.ok || !data.taskId) {
      throw new Error(data.error || "Kling could not start the video.");
    }

    addMessage("Your video is being generated. This can take a few minutes. 💗","bot");

    let completed = false;

    for (let attempt=0; attempt<60; attempt++) {
      await new Promise(resolve => setTimeout(resolve,5000));

      const statusResponse = await fetch(
        "/api/video/status?taskId="+encodeURIComponent(data.taskId)
      );

      const statusData = await statusResponse.json();

      if (!statusResponse.ok) {
        throw new Error(statusData.error || "Could not check video progress.");
      }

      if (statusData.status === "succeeded" && statusData.videoUrl) {
        addVideo(statusData.videoUrl,"Your new video of Aria");
        completed = true;
        break;
      }

      if (statusData.status === "failed") {
        throw new Error(statusData.message || "Kling could not complete the video.");
      }
    }

    if (!completed) {
      addMessage("The video is taking longer than expected. Your task may still be processing. Please try again later.","bot");
    }

  } catch(error) {
    addMessage("I couldn't create the video. "+error.message,"bot");
  } finally {
    busy = false;
    videoButton.disabled = false;
    photoButton.disabled = false;
    videoSceneInput.disabled = false;
    videoStatus.style.display = "none";
  }
}

videoForm.addEventListener("submit",async event => {
  event.preventDefault();
  const scene = videoSceneInput.value.trim();
  if (!scene || busy) return;

  if (!confirm("Create this video of Aria? This may use paid Kling credits.")) return;

  addMessage("Create a video: "+scene,"user");
  videoSceneInput.value = "";
  await generateVideo(scene);
});
</script>
</body>
</html>
