
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const girl = (urlParams.get('girl') || 'aria').toLowerCase();

  const girls = {
    aria: "Aria",
    maya: "Maya",
    luna: "Luna",
    sofia: "Sofia",
    ella: "Ella",
    nova: "Nova",
    zara: "Zara",
    ivy: "Ivy",
    ruby: "Ruby",
    chloe: "Chloe",
    nina: "Nina",
    lila: "Lila",
    amber: "Amber",
    violet: "Violet",
    scarlett: "Scarlett",
    jade: "Jade",
    rose: "Rose",
    stella: "Stella",
    kira: "Kira",
    diana: "Diana",
    freya: "Freya",
    sienna: "Sienna",
    valentina: "Valentina",
    aurora: "Aurora"
  };

  const girlName = girls[girl] || girls.aria;
  const characterId = girls[girl] ? girl : "aria";

  document.getElementById('girlName').textContent = girlName;

  let chatHistory = [];

  function goBack() {
    window.location.href = "index.html";
  }

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = isUser ? 'message user' : 'message bot';
    div.textContent = text;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop =
      document.getElementById('messages').scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, true);
    input.value = '';

    chatHistory.push({ role: "user", content: text });

    const typing = document.createElement('div');
    typing.className = 'message bot';
    typing.id = 'typing';
    typing.textContent = "Typing...";
    document.getElementById('messages').appendChild(typing);

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          character: characterId,
          message: text,
          history: chatHistory
        })
      });

      const data = await response.json();

      document.getElementById('typing')?.remove();

      if (!response.ok || !data.reply) {
        throw new Error(data.error || "AI service error: " + response.status);
      }

      addMessage(data.reply, false);

      chatHistory.push({
        role: "assistant",
        content: data.reply
      });

    } catch (error) {
      document.getElementById('typing')?.remove();
      addMessage(
        "I'm having trouble connecting right now. Please try again shortly. (" +
        error.message + ")",
        false
      );
    }
  }

  addMessage(
    `Hey! I'm ${girlName}. It's lovely to meet you. What would you like to talk about? ❤️`,
    false
  );

  document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
