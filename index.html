<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartmate AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">heartmate<span>.ai</span></div>
  </header>

  <main>
    <h2 class="title">Choose your girlfriend</h2>
    <p class="subtitle">Tap any girl to start sexy chat</p>

    <div class="characters-grid">
      <div class="character-card" onclick="startChat('aria')">
        <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=500&fit=crop" alt="Aria">
        <div class="card-info">
          <h3>Aria</h3>
          <span>Sweet & Naughty</span>
        </div>
      </div>

      <div class="character-card" onclick="startChat('luna')">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=500&fit=crop" alt="Luna">
        <div class="card-info">
          <h3>Luna</h3>
          <span>Dominant & Teasing</span>
        </div>
      </div>

      <div class="character-card" onclick="startChat('sofia')">
        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&h=500&fit=crop" alt="Sofia">
        <div class="card-info">
          <h3>Sofia</h3>
          <span>Romantic & Dirty</span>
        </div>
      </div>

      <div class="character-card" onclick="startChat('mia')">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&h=500&fit=crop" alt="Mia">
        <div class="card-info">
          <h3>Mia</h3>
          <span>Playful & Horny</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    function startChat(girl) {
      window.location.href = `chat.html?girl=${girl}`;
    }
  </script>
</body>
</html>
