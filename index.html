    </nav>
  </div>

  <!-- ==================== CHAT PAGE ==================== -->
  <div id="chat" style="display:none;">
    <header class="chat-header">
      <button onclick="goHome()" class="back">←</button>
      <div class="chat-info">
        <div class="avatar" id="chat-avatar">A</div>
        <div>
          <div class="name" id="chat-name">Aria</div>
          <div class="status">Online</div>
        </div>
      </div>
      <div></div>
    </header>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div id="typing" class="typing"></div>
      <form id="form" class="composer">
        <textarea id="input" placeholder="Say something sexy..." rows="1"></textarea>
        <button type="submit">➤</button>
      </form>
    </div>
  </div>

  <script>
    const girls = [
      { id: "aria", name: "Aria", tag: "Warm & Playful", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&h=700&fit=crop", badge: "HOT" },
      { id: "maya", name: "Maya", tag: "Confident & Sexy", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&h=700&fit=crop", badge: "SEXY" },
      { id: "luna", name: "Luna", tag: "Soft & Naughty", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&h=700&fit=crop", badge: "NEW" },
      { id: "sofia", name: "Sofia", tag: "Sweet Temptation", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&h=700&fit=crop", badge: "HOT" },
      { id: "ella", name: "Ella", tag: "Cute & Flirty", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&h=700&fit=crop", badge: "" },
      { id: "nova", name: "Nova", tag: "Wild Energy", img: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500&h=700&fit=crop", badge: "EXCLUSIVE" },
      { id: "zara", name: "Zara", tag: "Exotic Beauty", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&h=700&fit=crop&sat=-30", badge: "HOT" },
      { id: "ivy", name: "Ivy", tag: "Mysterious", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&h=700&fit=crop&sat=-40", badge: "SEXY" },
      { id: "ruby", name: "Ruby", tag: "Passionate", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&h=700&fit=crop&sat=-50", badge: "NEW" },
      { id: "chloe", name: "Chloe", tag: "Playful Tease", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&h=700&fit=crop&sat=-20", badge: "HOT" },
      { id: "nina", name: "Nina", tag: "Seductive", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&h=700&fit=crop&sat=-60", badge: "" },
      { id: "lila", name: "Lila", tag: "Soft Domme", img: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500&h=700&fit=crop&sat=-70", badge: "EXCLUSIVE" },
      { id: "amber", name: "Amber", tag: "Sun Kissed", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&h=700&fit=crop", badge: "HOT" },
      { id: "violet", name: "Violet", tag: "Dark Desire", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&h=700&fit=crop", badge: "SEXY" },
      { id: "scarlett", name: "Scarlett", tag: "Fiery", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&h=700&fit=crop", badge: "NEW" },
      { id: "jade", name: "Jade", tag: "Exotic", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&h=700&fit=crop", badge: "HOT" },
      { id: "rose", name: "Rose", tag: "Romantic", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&h=700&fit=crop", badge: "" },
      { id: "stella", name: "Stella", tag: "Glamorous", img: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500&h=700&fit=crop", badge: "EXCLUSIVE" },
      { id: "kira", name: "Kira", tag: "Bold", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&h=700&fit=crop", badge: "HOT" },
      { id: "diana", name: "Diana", tag: "Elegant", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&h=700&fit=crop", badge: "SEXY" },
      { id: "freya", name: "Freya", tag: "Nordic", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500&h=700&fit=crop", badge: "NEW" },
      { id: "sienna", name: "Sienna", tag: "Curvy & Warm", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500&h=700&fit=crop", badge: "HOT" },
      { id: "valentina", name: "Valentina", tag: "Latina Fire", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=500&h=700&fit=crop", badge: "EXCLUSIVE" },
      { id: "aurora", name: "Aurora", tag: "Dream Girl", img: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=500&h=700&fit=crop", badge: "HOT" }
    ];

    let current = null;
    let history = {};

    // Render girls
    function render() {
      const grid = document.getElementById("grid");
      grid.innerHTML = girls.map(g => `
        <div class="card" onclick="openChat('${g.id}')">
          <div class="img">
            <img src="${g.img}" alt="${g.name}" loading="lazy">
            ${g.badge ? `<span class="badge">${g.badge}</span>` : ""}
          </div>
          <div class="info">
            <h3>${g.name}</h3>
            <p>${g.tag}</p>
          </div>
        </div>
      `).join("");
    }

    function openChat(id) {
      current = girls.find(g => g.id === id);
      if (!current) return;

      document.getElementById("home").style.display = "none";
      document.getElementById("chat").style.display = "flex";

      document.getElementById("chat-name").textContent = current.name;
      document.getElementById("chat-avatar").textContent = current.name[0];

      const box = document.getElementById("messages");
      box.innerHTML = `
        <div class="welcome">
          <div class="big-avatar">${current.name[0]}</div>
          <h3>Hey baby...</h3>
          <p>I've been waiting for you. What do you want to do with me tonight?</p>
        </div>
      `;

      if (history[id]) {
        history[id].forEach(m => addMessage(m.role, m.content, false));
      }
    }

    function goHome() {
      document.getElementById("chat").style.display = "none";
      document.getElementById("home").style.display = "block";
    }

    function addMessage(role, text, save = true) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = `<div class="bubble">${text}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;

      if (save && current) {
        if (!history[current.id]) history[current.id] = [];
        history[current.id].push({ role, content: text });
      }
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text || !current) return;

      addMessage("user", text);
      input.value = "";
      document.getElementById("typing").textContent = `${current.name} is typing...`;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            character: current.id,
            message: text,
            history: history[current.id] || []
          })
        });

        const data = await res.json();
        document.getElementById("typing").textContent = "";

        if (data.reply) {
          addMessage("assistant", data.reply);
        } else {
          addMessage("assistant", "Mmm... I'm a little distracted right now baby. Try again?");
        }
      } catch (err) {
        document.getElementById("typing").textContent = "";
        addMessage("assistant", "I couldn't connect right now. Please try again later.");
      }
    });

    // Auto-resize textarea
    document.getElementById("input").addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 110) + "px";
    });

    // Start
    render();
  </script>
</body>
</html>
