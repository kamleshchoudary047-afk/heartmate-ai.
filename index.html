    ];

    let currentGirl = null;

    // Render the grid
    function renderGrid(list = girls) {
      const grid = document.getElementById("character-grid");
      grid.innerHTML = "";
      list.forEach(g => {
        grid.innerHTML += `
          <div class="card" onclick="openChat('${g.id}', '${g.name}')">
            <div class="img-box">
              <img src="${g.img}" alt="${g.name}" loading="lazy">
              ${g.badge ? `<span class="badge">${g.badge}</span>` : ""}
            </div>
            <div class="info">
              <h3>${g.name}</h3>
              <p>${g.tag}</p>
            </div>
          </div>
        `;
      });
    }

    function openChat(id, name) {
      currentGirl = id;
      document.getElementById("home-view").style.display = "none";
      document.getElementById("chat-view").style.display = "flex";
      document.getElementById("chat-view").style.flexDirection = "column";
      document.getElementById("chat-girl-name").textContent = name;
      document.getElementById("messages").innerHTML = `
        <div style="text-align:center; padding:40px 20px; color:#aaa;">
          <div style="font-size:40px; margin-bottom:10px;">😘</div>
          <p>You are now chatting with <b>${name}</b></p>
          <p style="margin-top:8px; font-size:14px;">Say something sexy...</p>
        </div>
      `;
    }

    function backToHome() {
      document.getElementById("chat-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
    }

    function showHome() {
      renderGrid(girls);
      document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
      document.querySelector(".nav-item").classList.add("active");
    }

    function showHot() {
      const hot = girls.filter(g => g.badge === "HOT" || g.badge === "SEXY" || g.badge === "EXCLUSIVE");
      renderGrid(hot);
    }

    function showChats() {
      alert("Your previous chats will appear here soon");
    }

    // Simple send (temporary - later we connect real AI)
    function sendChat(e) {
      e.preventDefault();
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text) return;

      const messages = document.getElementById("messages");
      messages.innerHTML += `
        <div style="text-align:right; margin:12px 0;">
          <div style="display:inline-block; background:#ff4d94; color:white; padding:10px 16px; border-radius:18px; max-width:80%;">
            ${text}
          </div>
        </div>
      `;
      input.value = "";

      // Fake reply for now
      setTimeout(() => {
        messages.innerHTML += `
          <div style="margin:12px 0;">
            <div style="display:inline-block; background:#1a1a24; padding:10px 16px; border-radius:18px; max-width:80%;">
              Mmm I like that... tell me more baby 🔥
            </div>
          </div>
        `;
        messages.scrollTop = messages.scrollHeight;
      }, 800);
    }

    // Start
    renderGrid();
  </script>
